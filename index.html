<style>
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#f3f6fa;color:#172337;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid #175a9d;outline-offset:1px}
header{background:#102b4b;color:#fff;text-align:center;padding:24px 16px;padding-top:calc(24px + env(safe-area-inset-top))}
header h1{margin:0;font-size:24px;font-weight:800;line-height:1.2;letter-spacing:-0.03em}
header p{margin:8px 0 0;font-size:14px;font-weight:600;line-height:1.3;color:rgba(255,255,255,.92)}
.wrap{max-width:480px;margin:0 auto;padding:14px 8px 12px}
.cat{margin:0 0 20px}
.cat-head{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:24px;margin:0 0 3px}
.cat-head-start{justify-content:center;min-height:0;margin:0 0 14px}
.cat h2{margin:0;font-size:14px;font-weight:900;line-height:1.2;color:#102b4b;letter-spacing:-0.02em}
.start-btn{appearance:none;display:flex;align-items:center;justify-content:center;gap:6px;width:65%;height:44px;margin:0;padding:0 16px;border:0;border-radius:14px;background:#0c8a48;color:#fff;font-size:16px;font-weight:800;letter-spacing:-0.03em;box-shadow:inset 0 0 0 1px #086b38}
.start-btn:active{background:#086b38}
.start-btn svg{display:block;width:18px;height:18px}
.item-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.item-grid button{appearance:none;height:40px;min-width:0;padding:2px 3px;border:1px solid #c5d0dc;border-radius:8px;background:#fff;color:#1c3654;font-size:12px;font-weight:700;line-height:1.15;text-align:center;display:grid;place-items:center;word-break:keep-all}
.item-grid button:active{background:#e7f0f8}
.faq-list{display:flex;flex-direction:column;gap:4px}
.faq-q{appearance:none;display:flex;align-items:center;gap:10px;width:100%;min-height:42px;margin:0;padding:8px 10px;border:1px solid #c5d0dc;border-radius:8px;background:#fff;color:#1c3654;font-size:14px;font-weight:700;line-height:1.35;text-align:left}
.faq-q span{flex:1;min-width:0}
.faq-q::after{content:"";flex:0 0 auto;width:7px;height:7px;margin-right:2px;border-top:2px solid #326a9b;border-right:2px solid #326a9b;transform:rotate(45deg)}
.faq-q:active{background:#e7f0f8}
.script{background:#fff;border:1px solid #dbe3ed;border-radius:12px;padding:12px 12px 14px}
.tag{font-size:12px;font-weight:700;color:#27629a}
.script h2{margin:4px 0 8px;font-size:22px;line-height:1.3;letter-spacing:-0.03em;overflow-wrap:anywhere}
.section{border-top:1px solid #e2e8f0;padding:11px 0}
.section:first-child{border-top:0;padding-top:2px}
.step{font-size:14px;font-weight:800;color:#175a9d;margin-bottom:6px}
.words{white-space:pre-line;font-size:18px;line-height:1.7;overflow-wrap:anywhere}
.words+.words{margin-top:10px}
.hint{color:#64748b;font-size:12px;line-height:1.45;margin-top:8px}
.case-block{margin-top:18px;padding-top:16px;border-top:2px solid #c5d0dc}
.case-title{margin:0 0 14px;font-size:17px;font-weight:800;line-height:1.35;color:#102b4b}
.case-situation{margin:0 0 16px}
.case-principles{margin-top:4px;padding-top:12px;border-top:1px solid #e2e8f0}
.case-list{margin:0;padding-left:1.2em}
.case-list li{margin:0 0 8px}
body.in-item main{padding-bottom:calc(var(--bar-h, 96px) + 12px + env(safe-area-inset-bottom))}
.quickbar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;border-top:1px solid #cbd5e1;box-shadow:0 -3px 14px #17345b18;padding:6px 6px calc(6px + env(safe-area-inset-bottom));overflow:hidden}
.quickbar[hidden]{display:none}
.quickbar-inner{max-width:480px;margin:0 auto;display:grid;gap:4px}
.quickbar button{appearance:none;height:38px;min-width:0;padding:2px 3px;border:1px solid #c5d0dc;border-radius:8px;background:#fff;color:#1c3654;font-size:12px;font-weight:700;line-height:1.15;text-align:center;display:grid;place-items:center;word-break:keep-all}
.quickbar button.home{background:#102b4b;color:#fff;border-color:#102b4b}
.quickbar button.active{background:#175a9d;color:#fff;border-color:#175a9d}
.quickbar button:active{filter:brightness(.96)}
@media (min-width:360px){
  header h1{font-size:26px}
  header p{font-size:15px}
  .item-grid button{font-size:13px}
}
@media (min-width:390px){
  header h1{font-size:26px}
  header p{margin-top:8px}
  .cat h2{font-size:15px}
  .script h2{font-size:24px}
  .case-title{font-size:18px}
  .words{font-size:20px;line-height:1.75}
}
@media (max-height:700px){
  header{padding:18px 14px;padding-top:calc(18px + env(safe-area-inset-top))}
  header p{margin-top:6px}
  .wrap{padding-top:12px}
  .cat{margin-bottom:18px}
  .cat-head-start{margin-bottom:12px}
}
@media (max-height:640px){
  header{padding:16px 12px;padding-top:calc(16px + env(safe-area-inset-top))}
  header h1{font-size:22px}
  header p{margin-top:6px;font-size:13px}
  .wrap{padding-top:10px}
  .cat{margin-bottom:18px}
  .cat-head{margin-bottom:3px;min-height:22px}
  .cat-head-start{margin-bottom:10px;min-height:0}
}
</style>

<script type="application/json" id="source-items">
[{"category":"기본상담","title":"처음 전화 연결","source":"요약본 01","parts":[{"step":"인사","text":"안녕하세요~ 000님 맞으시죠?"},{"step":"","text":"네, 안녕하세요, 남부천세무서(체납관리단 000)입니다."},{"step":"안내","text":"000님 명의로 미납된 (교통 과태료)가 확인되어 납부 안내 차 전화 드렸습니다."},{"step":"위반 내용 요청","text":"00년 0월부터 누적된 신호위반 0건과 속도위반 0건입니다. (구체적으로 안내해야 수긍)"},{"step":"본론","text":"납부는 언제쯤 가능 하실까요?"}]},{"category":"기본상담","title":"왜, 국세청에서 전화?","source":"요약본 01","parts":[{"step":"답변 내용","text":"기존에는 각 중앙부처에서 개별적으로 관리하던 과태료나 부담금 또는 대지급금 등의 국세외 수입 체납금을\n전문적으로 관리하기 위해 국세청에서 일괄하여 관리하고 있습니다. \n그래서 저희 체납관리단에서 해당 내역을 안내해 드리고 있습니다."}]},{"category":"기본상담","title":"납부 의사 표시","source":"요약본 01","parts":[{"step":"가상계좌 요청 시","text":"과태료는 경찰청에서 수납관리하기 때문에 저희가 가상계좌 안내를 드릴 수 없습니다."},{"step":"","text":"대신 경찰서 민원실과 교통민원24 홈페이지와 앱을 통해 체납 내역과 가상계좌 납부 안내를 받으실 수 있는데, 원하시면 안내 문자를 보내 드리겠습니다."},{"step":"납부 방법 안내","text":"납부 안내를 받으실 수 있는 경찰서 전화번호를 문자로 보내 드리겠습니다."}]},{"category":"납부상담","title":"분납 의사","source":"요약본 01","parts":[{"step":"인사","text":"한꺼번에 납부하시기 어려운 상황이시군요. 저희 체납관리단에서는 분납을 직접 승인할 수 없습니다."},{"step":"분납 안내","text":"분납 가능 여부와 납부 횟수는 부과기관인 관할 경찰서에 문의하셔야 하는데, 분납 신청이 가능한지 한번 상담 받아 보세요."},{"step":"추가 안내","text":"관할 경찰서 연락처는 문자로 보내 드리겠습니다. \n다음 주까지 경찰서 방문이 가능 하실까요?"}]},{"category":"납부상담","title":"기납부 주장","source":"요약본 02","parts":[{"step":"납부일 기억 못함","text":"납부하셨군요, 혹시 언제쯤 납부하셨는지 기억나실까요?"},{"step":"","text":"네, 정확한 날짜가 기억나지 않으실 수 있습니다. 다만 현재 저희 전산에는 [20○○년 ○월 ○일] [위반 내용]으로 부과된 과태료가 미납으로 표시되어 있는데요,"},{"step":"","text":"000님께서 다른 고지서의 납부 내역과 혼동하셨을 가능성도 있어서, 현재 표시된 미납 건과 같은 건인지 확인이 필요합니다. 납부 여부는 관할 경찰서나 ‘교통민원24’에서 확인하실 수 있는데, 연락처와 이용 방법을 문자로 안내해 드리겠습니다."},{"step":"","text":"확인하시고 이미 납부한 건이면 납부 사실을 담당 기관에 알려주시면 됩니다.\n다음 주까지 확인이 가능 하실까요?"},{"step":"폐차 시 납부 주장","text":"네, 폐차하실 때 과태료를 정리하셨군요. 다만 폐차 당시 해당 과태료가 아직 체납 상태가 아니었다면 정산 대상에 포함되지 않아서 납부하지 않고 폐차한 경우도 자주 있습니다."},{"step":"","text":"현재 전산에는 미납 내역이 남아 있습니다. 폐차 당시 정산하신 항목에 이 과태료가 포함되었는지는 확인이 필요하세요."},{"step":"","text":"관할 경찰서 민원실이나 교통민원24 홈페이지와 앱에서 납부 여부를 확인하실 수 있습니다. \n관할 경찰서 연락처와 확인 방법을 문자로 보내 드리면, 다음주까지 처리 가능 하실까요?"}]},{"category":"이의제기","title":"위반 사실 부인","source":"요약본 02","parts":[{"step":"위반 사실 확인 안내","text":"저희는 체납 사실에 대한 안내를 하고 있어서 정확한 위반 내용은 ‘경찰서 민원실’에 가셔서 확인하시거나 ‘교통민원24’에서 확인할 수 있습니다."},{"step":"안내 문자 발송","text":"제가 안내 문자를 보내 드리겠습니다.\n문자에 안내된 민원실로 전화하시거나, ‘교통민원24’ 홈페이지나 앱에서 확인을 부탁드립니다."},{"step":"마무리","text":"이번 주말까지 처리가 가능 하실까요?"}]},{"category":"방문상담","title":"생활고 호소","source":"요약본 03","parts":[{"step":"인사","text":"현재 생활하시는 데 어려움이 많으신가요?"},{"step":"실태 조사 동의","text":"생활 형편을 확인하기 위해서 몇가지 여쭤봐도 괜찮으실까요?"}]},{"category":"방문상담","title":"체크리스트","source":"요약본 03","parts":[{"step":"해당 사항 체크","text":"현재 기초생활보장급여나 긴급복지 지원을 받고 계신가요?\n월세나 전기·가스 요금 등이 밀려 있으신가요?\n질병이나 부상으로 경제활동이 어려우신가요?"},{"step":"방문조사 동의","text":"체납 안내와 별개로, 현재 생활 형편을 살펴보고 복지 지원을 받을 수 있는지 확인하도록 방문팀이 찾아 봬도 \n괜찮으실까요?"}]},{"category":"방문상담","title":"선정 기준","source":"요약본 03","parts":[{"step":"한가지라도 해당할 경우 복지 연계 대상 방문팀에 인계","text":"복지 사각지대에 놓인 가구 \n:  실제로는 기초생활수급자나 차상위계층에 해당할 만큼 형편이 어렵지만, 제도를 모르거나 신청하지 못해 아무런 정부 지원을 못 받고 있는 경우"},{"step":"","text":"갑작스러운 위기 및 경제활동 단절\n: 실직, 휴ᆞ폐업 등으로 소득이 끊겨 생계가 막막한 상태"},{"step":"","text":"생계형 체납 누적 \n:  경제적 어려움으로 인해 월세(임대료), 전기ᆞ가스ᆞ수도 등 공과금이 수 개월째 밀려 있는 경우"},{"step":"","text":"질병/상해로 인한 근로 불가 \n:  일하다 다쳐서 수술 후 퇴원했거나, 중한 질병으로 장기 입원ᆞ투병 중이어서 당장 수입원이 전혀 없는 경우"}]},{"category":"특수 상황","title":"음성 사서함","source":"요약본 04","parts":[{"step":"메시지 내용","text":"안녕하세요. 남부천세무서입니다.\n○○○님께 안내드릴 사항이 있어 연락드렸습니다.\n메시지 확인하시면 핸드폰에 남겨진 전화번호나 남부천세무서로 연락 부탁드립니다."}]},{"category":"특수 상황","title":"보이스 피싱 의심","source":"요약본 04","parts":[{"step":"대응 방향","text":"요즘 보이스피싱이 많아 걱정되실 수 있습니다. \n저는 남부천세무서 체납관리단 조사원 ○○○입니다. \n제 소속이 의심스러우시면 남부천세무서 공식 전화번호로 확인하셔도 됩니다."},{"step":"추가 안내","text":"그리고 과태료 내역은 관할 경찰서나 교통민원24에서도 확인하실 수 있는데, 관할 경찰서 연락처와 확인 방법을 문자로 보내 드리겠습니다. 미납 내역이 맞는 것으로 확인되면 다음 주까지 납부 가능하실까요?"}]},{"category":"특수 상황","title":"폭언 대응","source":"요약본 04","parts":[{"step":"상황 대응","text":"선생님, 원활한 상담을 위해 욕설이나 고성은 삼가 주시기 바랍니다. \n폭언이 계속되면 상담을 진행하기 어려워 통화를 종료할 수 있습니다."},{"step":"상황 종료","text":"앞서 말씀드렸지만 폭언이 계속되어 정상적인 상담이 어렵습니다. \n부득이하게 통화를 종료하겠습니다."}]},{"category":"3자 통화","title":"부재 중","source":"요약본 05","parts":[{"step":"개인정보 보호 준수 과도한 걱정 불식","text":"지금 자리에 안 계시는군요. 크게 걱정하실 만한 일은 아니니 염려하지 않으셔도 됩니다.\n다만 본인께 안내드릴 행정 사항이라 개인정보 보호를 위해 구체적인 내용은 ○○○님께 직접 말씀드려야 합니다.\n언제쯤 통화가 가능할까요?"}]},{"category":"3자 통화","title":"입원 중","source":"요약본 05","parts":[{"step":"상담 방향","text":"입원 중이시군요. 빠른 쾌유를 빕니다. \n크게 걱정하실 일은 아니고 본인께 안내드릴 행정 사항이라 개인정보 보호를 위해 가족분께 바로 자세한 내용을 말씀드리기는 어렵습니다. \n본인께서 직접 통화하실 수 있는 시간대가 있을까요? \n직접 통화가 어려우시면 병문안 가셨을 때 본인 옆에서 전화를 걸어 직접 본인 동의를 받으면 그때 자세히 안내해 드리겠습니다.\n혹시 언제쯤 가능할까요?"}]},{"category":"3자 통화","title":"요양/교정 시설","source":"요약본 05","parts":[{"step":"","text":"네, 지금은 직접 통화가 어려우시군요. 크게 걱정하실 일은 아니고 간단한 행정 안내 건입니다.\n다만 가족분께 내용을 말씀드리려면 본인의 위임이나 대리인 확인 절차가 필요해서 지금 말씀드리기 어렵습니다. \n우선 저희 전산에 ‘요양 병원 입원(교정 시설 체류) 중’으로 메모해 두고 안내 문자를 발송해 드릴 테니, 경찰서 민원실에서 대리인 확인 진행을 하신 후 안내 내용 확인을 하시면 될 것 같습니다. \n아니면 본인의 동의 하에 전화받으신 분께서 ‘교통민원24’ 홈페이지나 앱에서 직접 확인하실 수 있습니다.\n제가 안내 문자를 보내 드리겠습니다."}]},{"category":"3자 통화","title":"해외 체류","source":"요약본 05","parts":[{"step":"","text":"지금 해외에 계시는군요. 걱정하실 만한 큰일은 아니고 간단한 행정 안내 건입니다. \n개인정보 보호 때문에 가족분께 바로 설명해 드리기는 어렵고, 본인께서 카카오톡이나 인터넷 전화로 저희 대표번호로 연락을 주시거나, 본인 명의의 핸드폰으로 문자수신이 가능하시면 그쪽으로 안내문을 발송해 드릴 수 있습니다. \n혹시 언제쯤 귀국 예정이신지 알 수 있을까요?"}]},{"category":"FAQ","title":"안 내면 어떻게 되나요? 세금도 아닌데 재산 압류 같은 걸 하나요?","source":"FAQ 01","parts":[{"step":"상담 답변","text":"국세외수입 체납금도 법령에 따라 국세 체납처분의 예를 준용하여 징수합니다.\n납부를 계속 미루시면 매월 가산금(중가산금)이 불어나고, 일정 기간이 지나면 관련 법령에 근거한 행정처분 등의 불이익이 발생할 수 있습니다. \n\n가산금이 더 늘어나고 압류 절차가 진행되기 전에 정리하시는 것이 유리합니다."}]},{"category":"FAQ","title":"원금만 내고 가산금은 좀 깎아 줄 수 있나요?","source":"FAQ 01","parts":[{"step":"상담 답변","text":"가산금은 납부 기한이 지나면 관련 법률에 따라 전산에서 자동으로 부과되는 법정 금액이기 때문에 저희 체납관리단이나 담당 공무원이 임의로 감면하거나 깎아드릴 수 있는 권한이 없습니다. \n다만, 지금이라도 납부하시면 앞으로 매월 추가로 붙는 중가산금은 더 이상 발생하지 않으니, 빨리 납부하시는 것이 금액을 아끼시는 방법입니다."}]},{"category":"FAQ","title":"신용카드로 결제하거나 할부로 낼 수 있나요?","source":"FAQ 01","parts":[{"step":"상담 답변","text":"‘교통민원24’ 홈페이지 또는 앱에서 납부가 가능합니다. \n다만, 결제 기관의 사정에 따라 카드납부가 제한되는 경우도 있으니까 확인이 요청됩니다."}]},{"category":"FAQ","title":"과태료가 언제, 어디서, 왜 찍힌 건지 정확한 위반 내역이나 사진을 볼 수 있나요?","source":"FAQ 01","parts":[{"step":"상담 답변","text":"저희 전산에는 부과 기관, 부과 일자, 과태료 명목과 금액 등 기본 내역만 확인됩니다. \n단속 사진이나 구체적인 위반 경위 등 상세 증빙 자료는 원 부과기관인 관할 경찰서 민원실에서 보관하고 있으므로, 해당 부서에 문의하시거나 ‘교통민원24’에서 직접 조회해 보실 수 있습니다."}]},{"category":"FAQ","title":"가상계좌를 받았는데 유효기간이 지나서 입금이 안 됩니다.","source":"FAQ 01","parts":[{"step":"상담 답변","text":"체납 안내용 가상계좌는 가산금 변동 등의 이유로 보통 발급일로부터 일정 기간만 유효합니다. \n기간이 지나 입금이 안 되실 때는 관할 경찰서 민원실 또는 ‘교통민원24’에서 가상계좌를 확인하셔서 납부하실 수 있습니다."}]},{"category":"FAQ","title":"문자로 오는 계좌번호가 진짜인지 찝찝한데, 문자를 안 받고 직접 조회해서 내는 방법은 없나요?","source":"FAQ 02","parts":[{"step":"상담 답변","text":"네, 당연히 가능합니다. \n문자가 불안하시면 문자 링크를 누르지 마시고, ‘교통민원24’에 직접 접속하셔서 공동인증서나 간편인증으로 로그인하시면 선생님 성함으로 미납된 국세외수입 내역이 모두 조회됩니다. \n거기서 바로 납부하시면 가장 안전합니다."}]},{"category":"FAQ","title":"그 차는 내 명의였지만, 실제 운전은 다른 사람이 했습니다. 그 사람한테 받으세요.","source":"FAQ 02","parts":[{"step":"상담 답변","text":"사정은 충분히 이해합니다만, 행정법상 과태료와 부담금은 위반 당시 공부상 소유자(명의자)에게 납부 의무가 부과됩니다.\n우선 명의자이신 선생님께서 납부하셔야 압류 등의 불이익을 피하실 수 있으며, 실제 운전하신 분과의 정산은 개인 간에 별도로 해결하셔야 합니다."}]},{"category":"FAQ","title":"5년 전 일인데 소멸시효가 지나서 안 내도 되는 거 아닌가요?","source":"FAQ 02","parts":[{"step":"상담 답변","text":"국세외수입 채권의 소멸시효는 원칙적으로 5년이지만, 그사이에 독촉장 발송, 납부 최고, 재산 압류 등의 조치가 있었다면 시효가 중단되어 새로 진행됩니다. \n현재 저희 전산에 살아 있는 건은 시효가 완성되지 않은 유효한 체납 건이므로 납부 의무가 남아 있습니다."}]},{"category":"FAQ","title":"고지서 한 장 못 받았는데 가산금까지 내라는 게 말이 됩니까?","source":"FAQ 02","parts":[{"step":"상담 답변","text":"고지서를 직접 못 받으셔서 가산금까지 붙은 걸 지금 아셨으니 충분히 억울하고 답답하실 만합니다. \n\n다만 행정 절차상 최초 고지서와 독촉장은 선생님께서 당시 주민등록상 전입신고 되어 있던 주소지로 등기나 일반우편 발송이 진행됩니다. \n\n혹시 그 사이에 이사를 하셨거나 우편물 수령이 어려운 상황이셨다면, 반송 절차를 거쳐 법적으로 고지 효력이 발생하는 ‘공시송달‘ 처리가 되어 가산금이 자동으로 부과된 것으로 보입니다."}]},{"category":"FAQ","title":"내 잘못도 아닌데 원금만 내면 안 되나요?","source":"FAQ 02","parts":[{"step":"상담 답변","text":"말씀하신 사정은 이해하지만, 저희 국세외수입 체납관리단은 이미 확정된 체납액을 안내하는 곳이라 저희 임의로 가산금을 \n빼 드리거나 감면해 드릴 수 있는 권한이 없습니다. \n\n만약 고지서 송달 과정에 명백한 행정 착오가 있었는지 확인하시려면, 원 부과 기관인 [관할 경찰서 민원실]에 직접 문의하셔서 소명 절차를 밟아 보셔야 합니다."}]}]
</script>
<script>
const sourceItems = JSON.parse(document.getElementById("source-items").textContent);
const app = document.getElementById("app");
const quickbar = document.getElementById("quickbar");

function findTitle(title) {
  const found = sourceItems.find((item) => item.title === title);
  if (!found) throw new Error("missing item: " + title);
  return found;
}

const callSrc = findTitle("처음 전화 연결");
const intentSrc = findTitle("납부 의사 표시");
const paidSrc = findTitle("기납부 주장");
const scrapAt = paidSrc.parts.findIndex((part) => part.step === "폐차 시 납부 주장");
const paidParts = paidSrc.parts.slice(0, scrapAt);
const scrapParts = paidSrc.parts.slice(scrapAt);

function adopt(id, label, category, src, parts) {
  return { id, label, category, source: src.source, parts: parts || src.parts };
}

const items = [
  {
    id: "call",
    label: "전화연결",
    category: "기본상담",
    source: callSrc.source,
    parts: [
      { step: "인사", text: callSrc.parts[0].text },
      { step: "", text: callSrc.parts[1].text },
      { step: "안내", text: callSrc.parts[2].text },
      { step: "위반내용", text: callSrc.parts[3].text },
      { step: "본론", text: callSrc.parts[4].text },
      { step: "가상계좌 요청", text: intentSrc.parts[0].text },
      { step: "", text: intentSrc.parts[1].text },
      { step: "납부방법 안내", text: intentSrc.parts[2].text }
    ]
  },
  adopt("voicemail", "음성사서함", "기본상담", findTitle("음성 사서함")),
  adopt("why", "왜 국세청?", "기본상담", findTitle("왜, 국세청에서 전화?")),
  adopt("phish", "보이스피싱", "기본상담", findTitle("보이스 피싱 의심")),
  adopt("abuse", "폭언대응", "기본상담", findTitle("폭언 대응")),
  adopt("install", "분납", "납부상담", findTitle("분납 의사")),
  adopt("paid", "기납부", "납부상담", paidSrc, paidParts),
  adopt("deny", "위반 부인", "납부상담", findTitle("위반 사실 부인")),
  adopt("scrap", "폐차 납부", "납부상담", paidSrc, scrapParts),
  adopt("hardship", "생활고 호소", "방문상담", findTitle("생활고 호소")),
  adopt("check", "체크리스트", "방문상담", findTitle("체크리스트")),
  adopt("criteria", "선정기준", "방문상담", findTitle("선정 기준")),
  adopt("absent", "부재중", "3자 통화", findTitle("부재 중")),
  adopt("hospital", "입원 중", "3자 통화", findTitle("입원 중")),
  adopt("care", "요양·교정", "3자 통화", findTitle("요양/교정 시설")),
  adopt("abroad", "해외 체류", "3자 통화", findTitle("해외 체류"))
];
sourceItems.forEach((item, index) => {
  if (item.category === "FAQ") items.push(adopt("faq-" + index, item.title, "FAQ", item));
});

const itemMap = {};
items.forEach((item) => { itemMap[item.id] = item; });

itemMap.abuse.cases = [
  {
    title: "사례 1. 업무 범위 외 요구 및 강압적 항의",
    situations: [
      { title: "① 사전 확인 부족에 대해 항의하는 경우", text: "“선생님께서 불편하게 생각하시는 부분은 충분히 이해합니다. 다만 저희 체납관리단은 경찰서로부터 전달받은 체납자료를 바탕으로 체납 사실과 납부 절차를 안내해 드리고 있습니다. 현재 정확한 납부금액이나 가상계좌는 관할 경찰서에서 확인하셔야 합니다.”" },
      { title: "② 가상계좌 발급이나 납부금액 확인을 대신 요구하는 경우", text: "“저희가 직접 처리해 드릴 수 있다면 도와드리겠습니다만, 해당 업무는 저희에게 처리 권한이 부여되어 있지 않습니다. 번거로우시더라도 관할 경찰서에 직접 문의해 주시기 바랍니다.”" },
      { title: "③ 국민의 세금으로 월급을 받으면서 왜 처리해 주지 않느냐고 항의하는 경우", text: "“선생님 말씀은 이해합니다. 다만 기관마다 담당하는 업무와 권한이 정해져 있습니다. 저희가 도와드리기 싫어서가 아니라 업무 권한상 직접 처리해 드릴 수 없는 점을 양해해 주시기 바랍니다.”" },
      { title: "④ 개인정보 및 업무 권한에 대해 따지는 경우", text: "“저희가 안내해 드리는 체납정보는 상담 업무를 위해 제공받은 자료입니다. 그 외의 정보를 추가로 조회하거나 가상계좌를 발급받는 것은 저희 업무 권한에 포함되어 있지 않습니다.”" },
      { title: "⑤ 같은 요구를 반복하며 장시간 항의하는 경우", text: "“선생님께서 요청하시는 내용은 충분히 이해했습니다. 다만 같은 내용을 반복해서 말씀하시더라도 저희가 처리해 드릴 수 있는 업무 범위는 달라지지 않습니다. 앞서 안내해 드린 관할 경찰서로 문의해 주시기 바랍니다.”" },
      { title: "⑥ 욕설이나 위협적인 발언을 하는 경우", text: "“선생님, 원활한 상담을 위해 욕설이나 위협적인 말씀은 삼가 주시기 바랍니다. 이러한 발언이 계속될 경우 정상적인 상담이 어려워 통화를 종료할 수밖에 없습니다.”" },
      { title: "⑦ 민원을 제기하겠다고 하는 경우", text: "“민원 제기는 선생님께서 판단하실 사항입니다. 저는 정해진 업무 범위 내에서 안내해 드렸습니다. 추가로 안내해 드릴 사항이 없다면 이만 통화를 마치겠습니다.”" }
    ],
    principles: {
      title: "■ 대응 원칙",
      items: [
        "민원인과 논쟁하거나 감정적으로 대응하지 않는다.",
        "처리할 수 없는 업무를 대신 처리해 주겠다고 약속하지 않는다.",
        "동일한 요구에는 일관된 답변을 유지한다.",
        "개인정보 문제보다는 업무 권한과 처리 범위를 중심으로 설명한다.",
        "욕설이나 위협이 지속되면 사전 경고 후 기관의 대응 지침에 따라 통화를 종료한다."
      ]
    }
  }
];

const homeGroups = [
  { title: "기본상담", start: "call", ids: ["voicemail", "why", "phish", "abuse"] },
  { title: "납부상담", ids: ["install", "paid", "deny", "scrap"] },
  { title: "방문상담", ids: ["hardship", "check", "criteria"] },
  { title: "3자 통화", ids: ["absent", "hospital", "care", "abroad"] }
];

const menus = {
  "기본상담": ["call", "voicemail", "why", "phish", "abuse"],
  "납부상담": ["install", "paid", "deny", "scrap"],
  "방문상담": ["hardship", "check", "criteria"],
  "3자 통화": ["absent", "hospital", "care", "abroad"]
};

const phoneIcon = '<svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" focusable="false"><path fill="currentColor" d="M6.62 10.79a15.1 15.1 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.02-.24 11.4 11.4 0 0 0 3.57.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1 11.4 11.4 0 0 0 .57 3.57 1 1 0 0 1-.25 1.02l-2.2 2.2z"/></svg>';

let currentId = null;

function esc(value) {
  return String(value).replace(/[&<>"']/g, (ch) => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[ch]));
}

function groupParts(parts) {
  const sections = [];
  parts.forEach((part) => {
    if (!sections.length || part.step) sections.push({ step: part.step, texts: [part.text] });
    else sections[sections.length - 1].texts.push(part.text);
  });
  return sections;
}

function renderHome() {
  document.body.classList.remove("in-item");
  quickbar.hidden = true;
  quickbar.innerHTML = "";
  const groups = homeGroups.map((group) => {
    const start = group.start
      ? `<button type="button" class="start-btn" data-id="${group.start}">${phoneIcon}<span>상담 시작</span></button>`
      : "";
    const buttons = group.ids.map((id) => `<button type="button" data-id="${id}">${esc(itemMap[id].label)}</button>`).join("");
    const head = start
      ? `<div class="cat-head cat-head-start">${start}</div>`
      : `<div class="cat-head"><h2>${esc(group.title)}</h2></div>`;
    const label = start ? ` aria-label="${esc(group.title)}"` : "";
    return `<section class="cat"${label}>${head}<div class="item-grid">${buttons}</div></section>`;
  }).join("");
  const faqs = items.filter((item) => item.category === "FAQ").map((item) => `<button type="button" class="faq-q" data-id="${item.id}"><span>${esc(item.label)}</span></button>`).join("");
  app.innerHTML = groups + `<section class="cat" id="faq"><div class="cat-head"><h2>FAQ</h2></div><div class="faq-list">${faqs}</div></section>`;
}

function columnCount(count) {
  const width = Math.min(window.innerWidth, 480);
  const usable = width - 12;
  const cell = (usable - 4 * (count - 1)) / count;
  if (cell >= 72) return count;
  return Math.ceil(count / 2);
}

function renderQuickbar(item) {
  const ids = menus[item.category] || [];
  const cols = ids.length ? columnCount(ids.length + 1) : 1;
  quickbar.hidden = false;
  quickbar.dataset.cols = String(cols);
  quickbar.setAttribute("aria-label", item.category + " 상담 항목");
  const buttons = [`<button type="button" class="home" data-home="1">홈</button>`]
    .concat(ids.map((id) => {
      const active = id === item.id;
      return `<button type="button" data-id="${id}"${active ? ' class="active" aria-current="page"' : ""}>${esc(itemMap[id].label)}</button>`;
    })).join("");
  const columns = ids.length ? `repeat(${cols},minmax(0,1fr))` : "88px";
  quickbar.innerHTML = `<div class="quickbar-inner" style="grid-template-columns:${columns}">${buttons}</div>`;
  document.documentElement.style.setProperty("--bar-h", quickbar.offsetHeight + "px");
}

function renderCases(cases) {
  if (!cases || !cases.length) return "";
  return cases.map((item) => {
    const situations = item.situations.map((situation) => `<section class="case-situation"><div class="step">${esc(situation.title)}</div><div class="words">${esc(situation.text)}</div></section>`).join("");
    const principles = item.principles
      ? `<section class="case-principles"><div class="step">${esc(item.principles.title)}</div><ul class="words case-list">${item.principles.items.map((text) => `<li>${esc(text)}</li>`).join("")}</ul></section>`
      : "";
    return `<section class="case-block"><h3 class="case-title">${esc(item.title)}</h3>${situations}${principles}</section>`;
  }).join("");
}

function renderItem(id) {
  const item = itemMap[id];
  document.body.classList.add("in-item");
  const sections = groupParts(item.parts).map((section) => {
    const heading = section.step ? `<div class="step">${esc(section.step)}</div>` : "";
    const texts = section.texts.map((text) => `<div class="words">${esc(text)}</div>`).join("");
    return `<section class="section">${heading}${texts}</section>`;
  }).join("");
  app.innerHTML = `<article class="script"><div class="tag">${esc(item.category)} · ${esc(item.source)}</div><h2>${esc(item.label)}</h2>${sections}${renderCases(item.cases)}<div class="hint">원본 매뉴얼 문구 · 실제 상담 전 관련 기관 지침 및 최신 법령 확인</div></article>`;
  renderQuickbar(item);
}

function render() {
  if (currentId) renderItem(currentId);
  else renderHome();
}

function openItem(id, replace) {
  if (!itemMap[id]) return;
  const same = currentId === id;
  currentId = id;
  const url = "#" + encodeURIComponent(id);
  if (replace) history.replaceState({ id }, "", url);
  else if (!same) history.pushState({ id }, "", url);
  render();
  window.scrollTo(0, 0);
}

function goHome() {
  currentId = null;
  history.pushState({ id: null }, "", location.pathname + location.search);
  render();
  window.scrollTo(0, 0);
}

app.addEventListener("click", (event) => {
  const button = event.target.closest("button[data-id]");
  if (!button) return;
  openItem(button.dataset.id, false);
});

quickbar.addEventListener("click", (event) => {
  if (event.target.closest("[data-home]")) {
    goHome();
    return;
  }
  const button = event.target.closest("button[data-id]");
  if (!button) return;
  openItem(button.dataset.id, true);
});

window.addEventListener("popstate", (event) => {
  const id = event.state && event.state.id;
  currentId = id && itemMap[id] ? id : null;
  render();
});

window.addEventListener("resize", () => {
  if (!currentId) return;
  renderQuickbar(itemMap[currentId]);
});

(function verifySourceCoverage() {
  const shown = new Set();
  items.forEach((item) => item.parts.forEach((part) => shown.add(part.text)));
  sourceItems.forEach((item) => {
    if (item.category === "FAQ") return;
    item.parts.forEach((part) => {
      if (!shown.has(part.text)) console.error("상담 문구 누락:", item.title);
    });
  });
})();

(function boot() {
  const hash = decodeURIComponent(location.hash.replace(/^#/, ""));
  if (hash && itemMap[hash]) {
    currentId = hash;
    history.replaceState({ id: hash }, "", "#" + encodeURIComponent(hash));
  } else {
    currentId = null;
    history.replaceState({ id: null }, "", location.pathname + location.search);
  }
  render();
})();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/sw.js", { updateViaCache: "none" }).catch(() => {});
  });
}
</script>
